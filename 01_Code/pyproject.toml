[project]
name = "modular-runtime-interventions-llm-agents"
version = "0.1.0"
description = "Runtime interventions for transactional LLM agents in consequential tau2 Retail workflows."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "scipy>=1.10.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
